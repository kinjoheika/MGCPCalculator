<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGC Pricing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/"><span class="mark" aria-hidden="true">M</span>MGC Pricing</a>
  <nav id="nav" aria-label="Screens"></nav>
  <div class="tools">
    <span id="bellwrap" class="bellwrap"></span>
    <span id="dbstat" class="small dbstat"></span>
    <label class="row small"><span class="muted">Acting as</span>
      <select id="who" aria-label="Acting as (prototype role switcher)"></select></label>
  </div>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
import * as store from './js/store.js';
import * as router from './js/router.js';
import { esc, toast } from './js/ui.js';
import * as db from './js/db.js';
import * as notify from './js/notify.js';

const app = document.getElementById('app');

// A failed module or a render error would otherwise leave a blank screen.
// Most often it is a half-cached set of files after an update, so offer the reload.
let shownFatal = false;
function showFatal(message) {
  if (shownFatal) return;
  shownFatal = true;
  const bar = document.createElement('div');
  bar.className = 'fatal';
  bar.innerHTML = `<div><b>Something failed to load.</b> <span class="small"></span>
    <div class="small">If the app was just updated, reload it fully with Ctrl+Shift+R (Cmd+Shift+R on Mac).</div></div>
    <button type="button" class="small">Reload</button>`;
  bar.querySelector('span').textContent = String(message || '').slice(0, 200);
  bar.querySelector('button').onclick = () => location.reload();
  document.body.prepend(bar);
}
window.addEventListener('error', e => showFatal(e.message));
window.addEventListener('unhandledrejection', e => {
  // A refused database write is not a broken page: say so and leave the screen as it was.
  if (e.reason?.name === 'DbError') { e.preventDefault(); toast('Not saved. ' + e.reason.message, 'bad'); return; }
  showFatal(e.reason?.message ?? e.reason);
});

// With a database configured, nobody gets in without a login.
function showLogin(message = '') {
  app.innerHTML = `<section class="page narrow login"><h1>Sign in</h1>
    <p class="muted">MGC Pricing</p>
    <form id="login" class="stack" autocomplete="on">
      <label class="field"><span>Email</span><input type="email" id="lg-email" autocomplete="username" required autofocus></label>
      <label class="field"><span>Password</span><input type="password" id="lg-pass" autocomplete="current-password" required></label>
      <p id="lg-err" class="err" role="alert">${esc(message)}</p>
      <button type="submit" class="primary">Sign in</button>
    </form></section>`;
  const form = document.getElementById('login');
  form.onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById('lg-err');
    err.textContent = '';
    try {
      await db.signIn(document.getElementById('lg-email').value, document.getElementById('lg-pass').value);
      location.reload();
    } catch (ex) { err.textContent = ex.message; }
  };
}
if (db.enabled && !(await db.getSession().catch(() => null))) {
  showLogin();
  await new Promise(() => {}); // stay on the login screen until the page reloads after signing in
}

try {
  await store.init();
} catch (e) {
  if (db.enabled) {
    app.innerHTML = `<section class="page narrow"><h1>Could not open the app</h1><p>${esc(e.message)}</p><button type="button" id="lg-out">Sign out</button></section>`;
    document.getElementById('lg-out').onclick = async () => { await db.signOut(); location.reload(); };
    throw e;
  }
  app.innerHTML = `<section class="page narrow"><h1>Could not start</h1>
    <p>${esc(e.message)}</p>
    <p>Serve the folder over HTTP: <code>python3 -m http.server 8000</code>, then open <code>http://localhost:8000/</code>.</p></section>`;
  throw e;
}

const dbstat = document.getElementById('dbstat');
const live = store.status().mode === 'database';
dbstat.textContent = live ? '● Database' : '○ Local only';
dbstat.title = live ? 'Saved to the shared database' : 'No database configured (js/config.js). Data stays in this browser.';
dbstat.classList.toggle('ok', live);
if (live) {
  // Signed in: the person is who they logged in as, not a dropdown.
  const me = store.currentUser();
  document.getElementById('who').closest('label').outerHTML = `<span class="small"><b>${esc(me.name)}</b> <span class="muted">${esc(me.role)}</span></span><button type="button" id="signout" class="small">Sign out</button>`;
  document.getElementById('signout').onclick = async () => { await db.signOut(); location.reload(); };
}

// Sliding panels sit below the header, whose height changes when it wraps.
const topbar = document.querySelector('.topbar');
new ResizeObserver(() => document.documentElement.style.setProperty('--topbar-h', topbar.offsetHeight + 'px')).observe(topbar);

const who = document.getElementById('who');
const nav = document.getElementById('nav');

function paintHeader(route, user) {
  const s = store.get();
  if (who.isConnected) who.innerHTML = s.users.map(u =>
    `<option value="${esc(u.id)}"${u.id === user.id ? ' selected' : ''}>${esc(u.name)} — ${esc(u.role)}</option>`).join('');
  nav.innerHTML = router.navFor(s, user).map(([href, label]) => {
    const on = href.slice(2) === route.name;
    const link = `<a href="${href}" class="${on ? 'on' : ''}"${on ? ' aria-current="page"' : ''}>${esc(label)}</a>`;
    const subs = href === '#/config' ? [router.configTabs(s), 'users'] : href === '#/priceroom' ? [router.priceRoomTabsFor(s, user), router.priceRoomTabsFor(s, user)[0]?.[0]] : null;
    if (!subs) return link;
    const cur = route.query?.tab || subs[1];
    return `<span class="has-sub">${link}<span class="submenu">${subs[0].map(([k, l]) =>
      `<a href="${href}?tab=${k}" class="${on && cur === k ? 'on' : ''}">${esc(l)}</a>`).join('')}</span></span>`;
  }).join('');
}

who.addEventListener('change', () => {
  if (!who.isConnected) return;
  store.setCurrentUser(who.value);
  location.hash = router.defaultHash(store.get(), store.currentUser());
});

notify.mount(document.getElementById('bellwrap'));
router.start(app, paintHeader);
</script>
</body>
</html>
