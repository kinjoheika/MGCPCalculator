<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGC pricing engine tests</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px; color: #111; background: #fff; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .summary { font-size: 18px; font-weight: 600; margin: 12px 0 20px; }
  .ok { color: #0a7a3d; } .bad { color: #b3261e; }
  ol { padding-left: 20px; } li { margin: 6px 0; font-variant-numeric: tabular-nums; }
  code { background: #f3f3f3; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<main>
  <h1>Pricing engine tests</h1>
  <div>Runs <code>js/engine.js</code> and <code>js/money.js</code> in the browser.</div>
  <div id="summary" class="summary">Running…</div>
  <ol id="out"></ol>
</main>
<script type="module">
import { resolvePrice, derivePremiumPerKg, defaultFloorPerKg } from './js/engine.js';
import { fmt, toCentavos, roundHalfUp } from './js/money.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
function check(name, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  ok ? pass++ : fail++;
  const li = document.createElement('li');
  li.className = ok ? 'ok' : 'bad';
  li.textContent = `${ok ? 'Pass' : 'Fail'} — ${name}` + (ok ? '' : ` (expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`);
  out.appendChild(li);
}

const cb = { acqPerKg: 6000, haulingPerKg: 200, effectiveFrom: '2026-08-11' };
const mgas = { id: '11KG_MGAS', contentKg: 11, label: '11 kg MGas' };

// 1–4. Dealer 11 kg MGas, zero premiums
const dealer = resolvePrice({
  costBasis: cb, sku: mgas, channel: { id: 'DEALER' }, marginPerKg: 1800,
  premiums: [], discounts: [], quantity: 1, vatRate: 0.12, vatInclusive: true,
});
check('Dealer 11 kg MGas net per cylinder is ₱880.00', fmt(dealer.netPerCyl), '₱880.00');
check('Dealer 11 kg MGas net per kg is 8000 centavos', dealer.netPerKg, 8000);
check('Zero-premium ladder has 4 steps (acq, hauling, margin, buffer)', dealer.ladder.map(l => l.step), ['Acquisition cost', 'Hauling', 'Margin', 'Buffer']);
check('Zero-premium case sits exactly on the floor', [dealer.floorPerKg, dealer.marginVsFloorPerKg, dealer.belowFloor], [8000, 0, false]);

// 5–8. Commercial, tank rental, dual supplier discount → below floor
const commercial = resolvePrice({
  costBasis: cb, sku: mgas, channel: { id: 'COMMERCIAL' }, marginPerKg: 5000, bufferPerKg: 0,
  premiums: [{ code: 'TANK_RENTAL', label: 'Tank rental', perKg: 100 }],
  discounts: [{ code: 'DUAL_SUPPLIER', label: 'Competition (dual supplier)', perKg: 700 }],
  quantity: 40, vatRate: 0.12, vatInclusive: true, floorPerKg: 11200,
});
check('Commercial ladder running totals', commercial.ladder.map(l => l.runningPerKg), [6000, 6200, 11200, 11300, 10600, 10600]);
check('Commercial per-cylinder figures', [commercial.netPerCyl, commercial.vatPerCyl, commercial.grossPerCyl, commercial.grossTotal], [116600, 13992, 130592, 5223680]);
check('Below-floor case flags ₱6.00/kg under', [commercial.belowFloor, commercial.marginVsFloorPerKg], [true, -600]);
check('Below-floor warning text', commercial.warnings, ['Final price is ₱6.00/kg below floor']);

// 9. Rounding edge — 2.7 kg: 8575 × 2.7 = 23152.5 centavos (₱231.525) → ₱231.53
const small = resolvePrice({
  costBasis: cb, sku: { id: '2.7KG', contentKg: 2.7, label: '2.7 kg' }, marginPerKg: 2375, vatRate: 0.12,
});
check('Rounding edge x.005 rounds half-up: 2.7 kg net per cyl ₱231.53', fmt(small.netPerCyl), '₱231.53');

// 10. Fractional per-kg component rounds once at its ladder step
const frac = resolvePrice({ costBasis: cb, sku: mgas, marginPerKg: 1800, bufferPerKg: 12.5, vatRate: 0 });
check('Buffer of 12.5 centavos rounds to 13 at its step', frac.ladder.at(-1).perKg, 13);

// 11. VAT off
const noVat = resolvePrice({ costBasis: cb, sku: mgas, marginPerKg: 1800, vatRate: 0.12, vatInclusive: false, quantity: 2 });
check('VAT-exclusive: gross equals net, total = 2 cylinders', [noVat.vatPerCyl, noVat.grossPerCyl, noVat.grossTotal], [0, 88000, 176000]);

// 12. Floor override respected
const override = resolvePrice({ costBasis: cb, sku: mgas, marginPerKg: 1800, floorPerKg: 9000 });
check('Floor override: ₱10.00/kg below a ₱90.00 floor', [override.belowFloor, override.marginVsFloorPerKg], [true, -1000]);

// 13. Commercial client, 40 × 11 kg MGas — hand check
const alta = resolvePrice({
  costBasis: cb, sku: mgas, marginPerKg: 5000,
  premiums: [{ code: 'TANK_RENTAL', label: 'Tank rental', perKg: 100 }, { code: 'CREDIT_30', label: 'Credit term 30 days', perKg: 150 }],
  discounts: [{ code: 'DUAL_SUPPLIER', label: 'Competition (dual supplier)', perKg: 600 }],
  quantity: 40, vatRate: 0.12, floorPerKg: defaultFloorPerKg(cb, 5000),
});
// 60.00 + 2.00 + 50.00 + 1.00 + 1.50 − 6.00 = 108.50/kg; ×11 = 1,193.50; VAT 143.22; 1,336.72 × 40 = 53,468.80
check('Sample 40 × 11 kg MGas total ₱53,468.80', [fmt(alta.grossPerCyl), fmt(alta.grossTotal)], ['₱1,336.72', '₱53,468.80']);

// 14. Derived premium
const roi = derivePremiumPerKg({ code: 'ROI_INSTALL', type: 'derived' }, { trmvKg: 135000, investmentCentavos: 1350675 });
check('Derived ROI premium 10.005 centavos/kg rounds to 10', roi, 10);
check('Derived premium without TRMV returns null', derivePremiumPerKg({ code: 'ROI_INSTALL', type: 'derived' }, { trmvKg: null, investmentCentavos: 5 }), null);

// 15. Purity
const input = { costBasis: cb, sku: mgas, marginPerKg: 1800, premiums: [{ code: 'X', label: 'X', perKg: 10 }], quantity: 3, vatRate: 0.12 };
const frozen = JSON.stringify(input);
check('Same input gives same output and input is not mutated',
  [JSON.stringify(resolvePrice(input)) === JSON.stringify(resolvePrice(input)), JSON.stringify(input) === frozen], [true, true]);

// 16. Money helpers
check('money.js: fmt, toCentavos, roundHalfUp', [fmt(133672), toCentavos('60.00'), toCentavos('₱1,336.72'), roundHalfUp(0.5), roundHalfUp(-0.5)],
  ['₱1,336.72', 6000, 133672, 1, -1]);

const s = document.getElementById('summary');
s.textContent = fail === 0 ? `All ${pass} passed` : `${fail} failed, ${pass} passed`;
s.className = 'summary ' + (fail === 0 ? 'ok' : 'bad');
</script>
</body>
</html>
