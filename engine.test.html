<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MGC pricing engine tests</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px; color: #111; background: #fff; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .summary { font-size: 18px; font-weight: 600; margin: 12px 0 20px; }
  .ok { color: #0a7a3d; } .bad { color: #b3261e; }
  ol { padding-left: 20px; } li { margin: 6px 0; font-variant-numeric: tabular-nums; }
  code { background: #f3f3f3; padding: 1px 4px; border-radius: 3px; }
</style>
</head>
<body>
<main>
  <h1>Pricing engine tests</h1>
  <div>Runs <code>js/engine.js</code> and <code>js/money.js</code> in the browser.</div>
  <div id="summary" class="summary">Running…</div>
  <ol id="out"></ol>
</main>
<script type="module">
import { resolvePrice, derivePremiumPerKg, defaultFloorPerKg } from './js/engine.js';
import { fmt, toCentavos, roundHalfUp } from './js/money.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
function check(name, actual, expected) {
  const ok = JSON.stringify(actual) === JSON.stringify(expected);
  ok ? pass++ : fail++;
  const li = document.createElement('li');
  li.className = ok ? 'ok' : 'bad';
  li.textContent = `${ok ? 'Pass' : 'Fail'} — ${name}` + (ok ? '' : ` (expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)})`);
  out.appendChild(li);
}

const cb = { acqPerKg: 6550, haulingPerKg: 225, effectiveFrom: '2026-08-11' };
const mgas = { id: '11KG_MGAS', contentKg: 11, label: '11 kg MGas' };

// 1–4. Dealer 11 kg MGas, zero premiums — reproduces ₱943.25/cyl
const dealer = resolvePrice({
  costBasis: cb, sku: mgas, channel: { id: 'DEALER' }, marginPerKg: 1800,
  premiums: [], discounts: [], quantity: 1, vatRate: 0.12, vatInclusive: true,
});
check('Dealer 11 kg MGas net per cylinder is ₱943.25', fmt(dealer.netPerCyl), '₱943.25');
check('Dealer 11 kg MGas net per kg is 8575 centavos', dealer.netPerKg, 8575);
check('Zero-premium ladder has 4 steps (acq, hauling, margin, buffer)', dealer.ladder.map(l => l.step), ['Acquisition cost', 'Hauling', 'Margin', 'Buffer']);
check('Zero-premium case sits exactly on the floor', [dealer.floorPerKg, dealer.marginVsFloorPerKg, dealer.belowFloor], [8575, 0, false]);

// 5–8. Spec example — commercial, tank rental, dual supplier discount → below floor
const spec = resolvePrice({
  costBasis: cb, sku: mgas, channel: { id: 'COMMERCIAL' }, marginPerKg: 4950, bufferPerKg: 0,
  premiums: [{ code: 'TANK_RENTAL', label: 'Tank rental', perKg: 90 }],
  discounts: [{ code: 'DUAL_SUPPLIER', label: 'Competition (dual supplier)', perKg: 675 }],
  quantity: 40, vatRate: 0.12, vatInclusive: true, floorPerKg: 11725,
});
check('Spec ladder running totals', spec.ladder.map(l => l.runningPerKg), [6550, 6775, 11725, 11815, 11140, 11140]);
check('Spec per-cylinder figures', [spec.netPerCyl, spec.vatPerCyl, spec.grossPerCyl, spec.grossTotal], [122540, 14705, 137245, 5489800]);
check('Below-floor case flags ₱5.85/kg under', [spec.belowFloor, spec.marginVsFloorPerKg], [true, -585]);
check('Below-floor warning text', spec.warnings, ['Final price is ₱5.85/kg below floor']);

// 9. Rounding edge — 2.7 kg dealer: 9075 × 2.7 = 24502.5 centavos (₱245.025) → ₱245.03
const small = resolvePrice({
  costBasis: cb, sku: { id: '2.7KG', contentKg: 2.7, label: '2.7 kg' }, marginPerKg: 2300, vatRate: 0.12,
});
check('Rounding edge x.005 rounds half-up: 2.7 kg net per cyl ₱245.03', fmt(small.netPerCyl), '₱245.03');

// 10. Fractional per-kg component rounds once at its ladder step
const frac = resolvePrice({ costBasis: cb, sku: mgas, marginPerKg: 1800, bufferPerKg: 12.5, vatRate: 0 });
check('Buffer of 12.5 centavos rounds to 13 at its step', frac.ladder.at(-1).perKg, 13);

// 11. VAT off
const noVat = resolvePrice({ costBasis: cb, sku: mgas, marginPerKg: 1800, vatRate: 0.12, vatInclusive: false, quantity: 2 });
check('VAT-exclusive: gross equals net, total = 2 cylinders', [noVat.vatPerCyl, noVat.grossPerCyl, noVat.grossTotal], [0, 94325, 188650]);

// 12. Floor override respected
const override = resolvePrice({ costBasis: cb, sku: mgas, marginPerKg: 1800, floorPerKg: 9000 });
check('Floor override: ₱4.25/kg below a ₱90.00 floor', [override.belowFloor, override.marginVsFloorPerKg], [true, -425]);

// 13. ALTA D' Tagaytay, 40 × 11 kg MGas — hand check
const alta = resolvePrice({
  costBasis: cb, sku: mgas, marginPerKg: 4950,
  premiums: [{ code: 'TANK_RENTAL', label: 'Tank rental', perKg: 90 }, { code: 'CREDIT_30', label: 'Credit term 30 days', perKg: 150 }],
  discounts: [{ code: 'DUAL_SUPPLIER', label: 'Competition (dual supplier)', perKg: 625 }],
  quantity: 40, vatRate: 0.12, floorPerKg: defaultFloorPerKg(cb, 4950),
});
// 65.50 + 2.25 + 49.50 + 0.90 + 1.50 − 6.25 = 113.40/kg; ×11 = 1,247.40; VAT 149.688 → 149.69; 1,397.09 × 40 = 55,883.60
check('ALTA 40 × 11 kg MGas total ₱55,883.60', [fmt(alta.grossPerCyl), fmt(alta.grossTotal)], ['₱1,397.09', '₱55,883.60']);

// 14. Derived premium
const roi = derivePremiumPerKg({ code: 'ROI_INSTALL', type: 'derived' }, { trmvKg: 135000, investmentCentavos: 1350675 });
check('Derived ROI premium 10.005 centavos/kg rounds to 10', roi, 10);
check('Derived premium without TRMV returns null', derivePremiumPerKg({ code: 'ROI_INSTALL', type: 'derived' }, { trmvKg: null, investmentCentavos: 5 }), null);

// 15. Purity
const input = { costBasis: cb, sku: mgas, marginPerKg: 1800, premiums: [{ code: 'X', label: 'X', perKg: 10 }], quantity: 3, vatRate: 0.12 };
const frozen = JSON.stringify(input);
check('Same input gives same output and input is not mutated',
  [JSON.stringify(resolvePrice(input)) === JSON.stringify(resolvePrice(input)), JSON.stringify(input) === frozen], [true, true]);

// 16. Money helpers
check('money.js: fmt, toCentavos, roundHalfUp', [fmt(137245), toCentavos('65.50'), toCentavos('₱1,372.45'), roundHalfUp(0.5), roundHalfUp(-0.5)],
  ['₱1,372.45', 6550, 137245, 1, -1]);

const s = document.getElementById('summary');
s.textContent = fail === 0 ? `All ${pass} passed` : `${fail} failed, ${pass} passed`;
s.className = 'summary ' + (fail === 0 ? 'ok' : 'bad');
</script>
</body>
</html>
